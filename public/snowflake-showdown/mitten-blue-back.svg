<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <!-- Back side, shown before the flip: the same outline as mitten-blue.svg with two knitted zigzag
       bands, so blue never relies on hue alone. Nothing on it to count. -->
  <defs>
    <path id="hand" d="M36 228C30 214 27.5 204 27.5 190V92C27.5 40 64 8 110 8s82.5 32 82.5 84v98c0 14-2.5 24-8.5 38z"/>
    <clipPath id="inside"><use href="#hand"/></clipPath>
    <pattern id="knit" width="12" height="10" patternUnits="userSpaceOnUse">
      <path d="M1.5 1.5 6 8l4.5-6.5" fill="none" stroke="#2f5888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".28"/>
    </pattern>
  </defs>
  <path d="M46 210C20 210 7 194 8 168l2-46c1-20 12-30 24-26 10 3 13 14 10 28z"
        fill="#4f86c9" stroke="#2f5888" stroke-width="5" stroke-linejoin="round"/>
  <path d="M22 114q-6 30-2 62" fill="none" stroke="#3f72b4" stroke-width="6" stroke-linecap="round" opacity=".6"/>
  <use href="#hand" fill="#4f86c9"/>
  <g clip-path="url(#inside)">
    <rect width="200" height="230" fill="url(#knit)"/>
    <path d="M20 86h180M20 128h180M20 150h180M20 192h180" fill="none" stroke="#9cc0ec" stroke-width="4"/>
    <path d="M20 117l11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11M20 181l11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11 11-11 11 11"
          fill="none" stroke="#fff6ed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M50 52c8-18 26-30 50-32" fill="none" stroke="#7fb0e6" stroke-width="6" stroke-linecap="round" opacity=".75"/>
  <use href="#hand" fill="none" stroke="#2f5888" stroke-width="5" stroke-linejoin="round"/>
  <rect x="34" y="220" width="152" height="72" rx="14" fill="#3d6ead"/>
  <path d="M34 247h152v18H34z" fill="#fff6ed"/>
  <path d="M48 226v60M62 226v60M76 226v60M90 226v60M104 226v60M118 226v60M132 226v60M146 226v60M160 226v60M174 226v60"
        fill="none" stroke="#2f5888" stroke-width="3" stroke-linecap="round" opacity=".3"/>
  <rect x="34" y="220" width="152" height="72" rx="14" fill="none" stroke="#2f5888" stroke-width="5"/>
</svg>
